# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: google-contacts-mcp

builds:
  - id: google-contacts-mcp
    main: ./cmd/google-contacts-mcp
    binary: google-contacts-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
