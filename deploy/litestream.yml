# Litestream v0.5 configuration (single `replica` key per database).
# Every value comes from the environment, so no bucket, endpoint or secret
# lives in the repository. deploy/start.sh only runs Litestream when
# LITESTREAM_REPLICA_URL is set.
#
#   GCMCP_DB_PATH                  SQLite file to replicate (exported by start.sh)
#   LITESTREAM_REPLICA_URL         e.g. s3://<bucket>/google-contacts-mcp.db
#   LITESTREAM_ENDPOINT            S3-compatible endpoint, e.g. https://cellar-c2.services.clever-cloud.com
#   LITESTREAM_ACCESS_KEY_ID       Cellar CELLAR_ADDON_KEY_ID
#   LITESTREAM_SECRET_ACCESS_KEY   Cellar CELLAR_ADDON_KEY_SECRET
dbs:
  - path: ${GCMCP_DB_PATH}
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      endpoint: ${LITESTREAM_ENDPOINT}
      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
      # Uncomment for Cellar if Litestream cannot reach the bucket with
      # virtual-host-style URLs (<bucket>.<endpoint>).
      # force-path-style: true
